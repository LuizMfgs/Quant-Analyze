universe: [AAPL, MSFT, JNJ, JPM, XOM, PG, UNH, HD, KO, CVX]  # 10 liquid, sector-diverse
history_start: "2015-01-01"
horizon_days: 21          # forecast 1 trading month ahead
initial_train: 756        # 3y warmup before first decision
rebalance_every: 21       # candidate rebalance monthly
cov_window: 756
weight_bounds: [0.0, 0.30]
objective: max_sharpe     # or efficient_risk / min_volatility
tau: 0.05
risk_aversion: 2.5
band: 0.05                # trade an asset only if |target - current| > 5%
min_turnover: 0.05        # skip rebalance entirely below 5% one-way turnover
cost_bps: 10              # transaction cost per side
lgbm_params:
  n_estimators: 400
  learning_rate: 0.03
  num_leaves: 31
  min_child_samples: 50
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
  random_state: 42